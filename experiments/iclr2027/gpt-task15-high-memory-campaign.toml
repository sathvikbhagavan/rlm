# Failed-only GPT-5-mini Task-15 recovery after the original local REPL
# exhausted its 8/4 GiB virtual-address-space guards.  This retains the global
# 30 GiB process-tree ceiling while granting the local process and one generated
# code turn enough headroom for full-corpus RDKit work.
schema_version = 1

[campaign]
name = "iclr2027-gpt5mini-direct-openai-task15-highmem-v1"
project_root = "../.."
artifact_dir = "artifacts/iclr2027-gpt5mini-direct-openai-task15-highmem-v1"
budget_chf = 5.0
usd_to_chf = 0.80
require_dataset = true
require_clean_git = true
require_metrics = true
max_parallel_memory_mib = 30720
required_secrets = ["OPENAI_API_KEY", "WANDB_API_KEY"]

[[runs]]
id = "direct-openai-task15-highmem-full-gpt-5-mini-tier4-task15-rlm-xfull-r04"
task = "tier4/task15"
condition = "recovery-xfull-direct-openai-highmem"
method = "rlm"
model = "gpt-5-mini"
corpus_size = "full"
seed = 42
repetitions = 1
estimated_cost_chf = 0.500000
memory_reservation_mib = 28672
memory_limit_mib = 30720
question_parallelism = 1
env = { RXNHAYSTACK_CONTEXT_SIZE = "-1", RXNHAYSTACK_PROVIDER = "openai", RXNHAYSTACK_RLM_MAX_TIMEOUT_SECONDS = "1800", RXNHAYSTACK_RLM_OUTPUT_LIMIT = "4096", RXNHAYSTACK_RLM_REASONING_EFFORT = "low", RXNHAYSTACK_RLM_LOCAL_MEMORY_LIMIT_MIB = "24576", RXNHAYSTACK_RLM_LOCAL_TOOL_MEMORY_LIMIT_MIB = "12288", RXNHAYSTACK_SOURCE_RUN_ID = "full-gpt-5-mini-tier4-task15-rlm-xfull-r04" }
command = ["uv", "run", "--frozen", "python", "tier4/rlm_task15.py"]
