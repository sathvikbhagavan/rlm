# Provenance-clean validation of missing-usage recovery and task-specific scoring.
schema_version = 1

[campaign]
name = "iclr2027-gpt5mini-missing-usage-scoring-pilots-v1"
project_root = "../.."
artifact_dir = "artifacts/iclr2027-gpt5mini-missing-usage-scoring-pilots-v1"
budget_chf = 0.40
usd_to_chf = 0.80
require_dataset = true
require_clean_git = true
require_metrics = true
max_parallel_memory_mib = 28672
required_secrets = ["OPENROUTER_API_KEY", "WANDB_API_KEY"]

[[runs]]
id = "pilot-gpt5mini-tier4-task14-rlm-xfull-r02"
source_run_id = "full-gpt-5-mini-tier4-task14-rlm-xfull-r02"
task = "tier4/task14"
condition = "full-xfull"
method = "rlm"
model = "openai/gpt-5-mini"
corpus_size = "full"
seed = 42
repetition_start = 2
repetitions = 1
estimated_cost_chf = 0.038706
memory_reservation_mib = 28672
memory_limit_mib = 30720
question_parallelism = 1
env = { RXNHAYSTACK_CONTEXT_SIZE = "-1", RXNHAYSTACK_PROVIDER = "openrouter", RXNHAYSTACK_RLM_MAX_TIMEOUT_SECONDS = "1800", RXNHAYSTACK_RLM_OUTPUT_LIMIT = "4096", RXNHAYSTACK_RLM_REASONING_EFFORT = "low", RXNHAYSTACK_RLM_LOCAL_MEMORY_LIMIT_MIB = "8192", RXNHAYSTACK_RLM_LOCAL_TOOL_MEMORY_LIMIT_MIB = "4096" }
command = ["uv", "run", "--frozen", "python", "tier4/rlm_task14.py"]

[[runs]]
id = "pilot-gpt5mini-tier4-task15-rlm-x100-r01"
source_run_id = "full-gpt-5-mini-tier4-task15-rlm-x100-r01"
task = "tier4/task15"
condition = "full-x100"
method = "rlm"
model = "openai/gpt-5-mini"
corpus_size = 100
seed = 42
repetitions = 1
estimated_cost_chf = 0.088855
memory_reservation_mib = 8192
memory_limit_mib = 16384
question_parallelism = 1
env = { RXNHAYSTACK_CONTEXT_SIZE = "100", RXNHAYSTACK_PROVIDER = "openrouter", RXNHAYSTACK_RLM_MAX_TIMEOUT_SECONDS = "1800", RXNHAYSTACK_RLM_OUTPUT_LIMIT = "4096", RXNHAYSTACK_RLM_REASONING_EFFORT = "low", RXNHAYSTACK_RLM_LOCAL_MEMORY_LIMIT_MIB = "8192", RXNHAYSTACK_RLM_LOCAL_TOOL_MEMORY_LIMIT_MIB = "4096" }
command = ["uv", "run", "--frozen", "python", "tier4/rlm_task15.py"]
